<title>Consultor Funcional Odoo 20</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra superior fija + índice lateral de cuaderno de trabajo + columna de lectura a ~70ch. */
:root {
  --ground: #F2F4F1;
  --surface: #FFFFFF;
  --ink: #17201C;
  --muted: #56615B;
  --line: #D6DBD5;
  --accent: #0B6B58;
  --accent-ink: #FFFFFF;
  --accent-soft: #DDEEE8;
  --mark: #9A5600;
  --mark-soft: #F6EAD7;
  --code-bg: #EBEEEA;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --top: 56px;
  --side: 300px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #101513; --surface: #161C19; --ink: #E4E9E6; --muted: #98A39D; --line: #2A3430;
    --accent: #4DC0A3; --accent-ink: #0D1F1A; --accent-soft: #15302A; --mark: #E2A44E; --mark-soft: #31270F;
    --code-bg: #1C2420; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #101513; --surface: #161C19; --ink: #E4E9E6; --muted: #98A39D; --line: #2A3430;
  --accent: #4DC0A3; --accent-ink: #0D1F1A; --accent-soft: #15302A; --mark: #E2A44E; --mark-soft: #31270F;
  --code-bg: #1C2420; color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--top) + 16px); }
body { background: var(--ground); color: var(--ink); font: 17px/1.62 var(--f-body); }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
code { font-family: var(--f-mono); font-size: .84em; background: var(--code-bg); padding: .08em .32em; border-radius: 3px; overflow-wrap: anywhere; }

/* barra superior */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: var(--top); display: flex; align-items: center; gap: 16px;
  padding-inline: 16px; background: var(--surface); border-bottom: 1px solid var(--line); font-family: var(--f-display); }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--ink); white-space: nowrap; min-width: 0; }
.brand b { font-weight: 800; font-stretch: 112%; font-size: 17px; letter-spacing: -.01em; }
.brand span { font-size: 13px; color: var(--muted); }
.search { margin-left: auto; position: relative; flex: 0 1 360px; min-width: 0; }
.search input { width: 100%; height: 36px; padding: 0 12px 0 34px; border: 1px solid var(--line); border-radius: 6px; background: var(--ground);
  color: var(--ink); font: 15px var(--f-display); }
.search svg { position: absolute; left: 10px; top: 10px; width: 16px; height: 16px; fill: none; stroke: var(--muted); stroke-width: 2; }
.menu { display: none; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink);
  font: 600 14px var(--f-display); cursor: pointer; }

/* estructura */
.shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); }
.side { position: sticky; top: calc(var(--top) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--top)); overflow-y: auto;
  border-right: 1px solid var(--line); background: var(--surface); font-family: var(--f-display); font-size: 14px; line-height: 1.35; }
.side-in { padding-block: 18px 40px; padding-inline: 14px; }
.side ul { list-style: none; margin: 0; padding: 0; }
.side a { display: block; padding: 5px 8px; border-radius: 5px; color: var(--ink); text-decoration: none; }
.side a:hover { background: var(--ground); }
.side a.on { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.side .csvlink { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.grp { margin: 18px 8px 6px; font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.ph-nav summary { list-style: none; display: flex; gap: 10px; align-items: baseline; padding: 6px 8px; border-radius: 5px; cursor: pointer; font-weight: 600; }
.ph-nav summary::-webkit-details-marker { display: none; }
.ph-nav summary:hover { background: var(--ground); }
.ph-nav summary b { font-stretch: 75%; font-weight: 800; color: var(--accent); min-width: 1.4em; text-align: right; font-variant-numeric: tabular-nums; }
.ph-nav ul { margin: 2px 0 8px 22px; padding-left: 10px; border-left: 1px solid var(--line); }
.ph-nav .sg { margin: 8px 8px 2px; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }

main { min-width: 0; padding-block: 32px 80px; padding-inline: clamp(16px, 4vw, 56px); }
.doc { max-width: 780px; }
.doc.home { max-width: 1060px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: baseline; margin-bottom: 18px;
  font: 13px var(--f-display); color: var(--muted); }
.src { color: var(--muted); text-decoration: none; }
.src code { background: none; padding: 0; }
.src:hover code { color: var(--accent); }

/* prosa renderizada desde el repositorio */
.prose h1, .prose h2, .prose h3, .prose h4 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; letter-spacing: -.01em; }
.prose h1 { font-size: 2.1rem; font-weight: 800; font-stretch: 108%; margin: 0 0 .6em; }
.prose h2 { font-size: 1.45rem; font-weight: 700; margin: 2.1em 0 .6em; padding-top: .9em; border-top: 1px solid var(--line); }
.prose h3 { font-size: 1.15rem; font-weight: 700; margin: 1.7em 0 .5em; }
.prose h4 { font-size: 1rem; font-weight: 700; margin: 1.4em 0 .4em; }
.prose p, .prose li { max-width: 68ch; }
.prose ul, .prose ol { padding-left: 1.4em; }
.prose li + li { margin-top: .25em; }
.prose hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
.prose blockquote { margin: 1.2em 0; padding: .7em 1.1em; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.prose blockquote > :first-child { margin-top: 0; }
.prose blockquote > :last-child { margin-bottom: 0; }
.prose pre { background: var(--code-bg); padding: 14px 16px; border-radius: 6px; overflow-x: auto; font: 13.5px/1.5 var(--f-mono); }
.prose pre code { background: none; padding: 0; font-size: inherit; overflow-wrap: normal; }
.tbl { overflow-x: auto; margin: 1.1em 0; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.tbl table { border-collapse: collapse; width: 100%; font: 14px/1.45 var(--f-display); font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-weight: 700; background: var(--ground); position: sticky; top: 0; }
.tbl th, .tbl td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td code { font-size: .86em; }
.csv table { font: 13px/1.4 var(--f-mono); white-space: nowrap; }
.csv th code { background: none; padding: 0; }
.csvmeta { display: flex; flex-wrap: wrap; gap: 8px; font: 13px var(--f-display); }
.csvmeta span { padding: 2px 10px; border-radius: 99px; background: var(--accent-soft); }
ul.idx { columns: 2 260px; font-family: var(--f-display); }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line); font-family: var(--f-display); }
.pager a { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 6px; text-decoration: none; color: var(--ink); background: var(--surface); }
.pager a:hover { border-color: var(--accent); }
.pager span { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.pager .nx { grid-column: 2; text-align: right; }

/* portada */
.hero { padding-block: 8px 28px; }
.eyebrow { font: 600 13px var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 0 0 12px; }
.hero h1 { font: 800 clamp(2.4rem, 6vw, 4.2rem)/1.02 var(--f-display); font-stretch: 118%; letter-spacing: -.025em; margin: 0 0 18px; text-wrap: balance; border: 0; padding: 0; }
.lede { font-size: 1.2rem; max-width: 60ch; color: var(--ink); margin: 0 0 22px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 26px; list-style: none; padding: 0; margin: 0 0 26px; font: 15px var(--f-display); color: var(--muted); }
.facts b { color: var(--ink); font-weight: 800; font-size: 1.25rem; font-variant-numeric: tabular-nums; margin-right: 4px; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-block; padding: 10px 18px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); font: 600 15px var(--f-display); text-decoration: none; border: 1px solid var(--accent); }
.btn.ghost { background: transparent; color: var(--accent); }
.block { margin-top: 48px; }
.block h2 { font: 800 1.6rem/1.2 var(--f-display); font-stretch: 105%; margin: 0 0 8px; padding: 0; border: 0; letter-spacing: -.01em; }
.sub { color: var(--muted); margin: 0 0 18px; max-width: 70ch; }
.note { color: var(--muted); font-size: .95rem; }

.phases-head, .ph { display: grid; grid-template-columns: 2.6rem minmax(0, 1fr) 13rem 15rem; gap: 6px 20px; align-items: start; }
.phases-head { font: 600 12px var(--f-display); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.ticks { position: relative; height: 1.2em; margin-top: 1.4em; }
.ticks span { position: absolute; transform: translateX(-50%); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.ticks span:first-child { transform: none; }
.ticks span:last-child { transform: translateX(-100%); }
.phases { list-style: none; margin: 0; padding: 0; }
.ph { padding-block: 14px; border-bottom: 1px solid var(--line); }
.ph-n { font: 800 1.5rem/1 var(--f-display); font-stretch: 75%; color: var(--accent); text-decoration: none; font-variant-numeric: tabular-nums; text-align: right; }
.ph-name { font: 700 1.05rem/1.3 var(--f-display); color: var(--ink); text-decoration: none; }
.ph-name:hover { color: var(--accent); }
.ph-foco { margin: 4px 0 0; font-size: .92rem; color: var(--muted); }
.ph-hours { display: flex; flex-direction: column; gap: 6px; font-family: var(--f-display); }
.ph-h { font-weight: 700; font-variant-numeric: tabular-nums; font-size: .95rem; }
.hbar { position: relative; height: 10px; border-radius: 2px; background: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 33.333%); background-color: var(--ground); }
.hb-base { position: absolute; left: 0; top: 4px; height: 2px; background: var(--accent-soft); }
.hb-range { position: absolute; top: 0; height: 10px; border-radius: 2px; background: var(--accent); }
.ph-ent { margin: 0; font-size: .92rem; }
.lbl { display: none; font: 600 11px var(--f-display); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }

.flow { display: grid; gap: 10px; }
.lane { display: grid; grid-template-columns: 12rem minmax(0, 1fr); gap: 4px 16px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.lane-t { font: 600 12px/1.3 var(--f-display); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding-top: 7px; }
.lane-c { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.lane-n { grid-column: 2; margin: 2px 0 0; font-size: .9rem; color: var(--muted); }
.lane-n .chip { padding: 1px 8px; font-size: 13px; }
.chip { display: inline-flex; gap: 7px; align-items: baseline; padding: 5px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--ground);
  font: 500 14px var(--f-display); color: var(--ink); text-decoration: none; }
.chip b { color: var(--accent); font-weight: 800; }
.chip:hover { border-color: var(--accent); }
.arr { color: var(--muted); font-family: var(--f-display); }

.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 0 40px; }
.case dl { display: grid; grid-template-columns: 7rem minmax(0, 1fr); gap: 8px 14px; margin: 16px 0 0; }
.case dt { font: 600 13px/1.6 var(--f-display); color: var(--muted); }
.case dd { margin: 0; }
.steps { list-style: none; counter-reset: s; padding: 0; margin: 14px 0 0; display: grid; gap: 14px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 0 10px; }
.steps li::before { content: counter(s); grid-row: span 2; font: 800 1.3rem/1.2 var(--f-display); font-stretch: 75%; color: var(--accent); }
.steps a { font: 700 1rem var(--f-display); text-decoration: none; }
.steps p { margin: 2px 0 0; color: var(--muted); font-size: .95rem; }

.v20 { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.v20 li { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; background: var(--surface); }
.v-area { font: 700 12px var(--f-display); letter-spacing: .07em; text-transform: uppercase; color: var(--mark); }
.v-txt { font-size: .97rem; }

.verify .vgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 24px; }
.verify h3 { font: 700 1rem var(--f-display); margin: 0 0 4px; }
.verify p { margin: 0; font-size: .97rem; }
.clog { margin-top: 28px !important; }
.commits { list-style: none; padding: 0; margin: 8px 0 0; font: 14px/1.4 var(--f-display); }
.commits li { display: grid; grid-template-columns: 5.5rem 6.5rem minmax(0, 1fr); gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.commits span:nth-child(2) { color: var(--muted); font-variant-numeric: tabular-nums; }
.foot { margin-top: 56px; font: 13px var(--f-display); color: var(--muted); }

/* búsqueda */
#buscar .hit { padding: 14px 0; border-bottom: 1px solid var(--line); }
#buscar .hit a { font: 700 1.05rem var(--f-display); text-decoration: none; }
#buscar .hit p { margin: 4px 0 0; font-size: .95rem; color: var(--muted); }
#buscar .hit small { display: block; font: 12px var(--f-mono); color: var(--muted); margin-top: 2px; }
mark { background: var(--mark-soft); color: var(--ink); padding: 0 .1em; border-radius: 2px; }

@media (max-width: 1000px) {
  .phases-head { display: none; }
  .ph { grid-template-columns: 2.4rem minmax(0, 1fr); }
  .ph-hours, .ph-ent { grid-column: 2; }
  .ph-hours { max-width: 340px; }
  .lbl { display: block; }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .menu { display: inline-block; }
  .side { position: fixed; top: calc(var(--top) + env(safe-area-inset-top, 0px)); left: 0; bottom: 0; width: min(88vw, 340px); height: auto;
    z-index: 15; transform: translateX(-102%); transition: transform .2s ease; box-shadow: 0 0 0 100vmax transparent; }
  body.nav-open .side { transform: none; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .35); }
  .brand span { display: none; }
  body { font-size: 16px; }
  .lane { grid-template-columns: minmax(0, 1fr); }
  .lane-n { grid-column: 1; }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager .nx { grid-column: 1; }
  .commits li { grid-template-columns: 5rem minmax(0, 1fr); }
  .commits span:nth-child(2) { display: none; }
}
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }
</style>

<div class="top">
  <button class="menu" id="menu" type="button" aria-controls="side" aria-expanded="false">Índice</button>
  <a class="brand" href="#inicio"><b>Consultor Funcional Odoo 20</b><span>Plan de estudios · 20.0</span></a>
  <label class="search" for="q">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
    <input id="q" type="search" placeholder="Buscar en todo el plan  ( / )" autocomplete="off" aria-label="Buscar en todo el plan">
  </label>
</div>
<div class="shell">
%%SIDE%%
<main id="main">
%%DOCS%%
<article class="doc" id="buscar" hidden><div class="prose"><h1>Resultados</h1><div id="hits"></div></div></article>
<p class="foot">Generado desde el repositorio <code>odoo-functional-consultant</code>, rama 20.0, commit <code>%%SHA%%</code>.</p>
</main>
</div>

<script>
(function () {
  const docs = Array.from(document.querySelectorAll('article.doc'));
  const byId = new Map(docs.map(d => [d.id, d]));
  const links = Array.from(document.querySelectorAll('.side a[data-doc]'));
  const q = document.getElementById('q');
  const hits = document.getElementById('hits');
  const menu = document.getElementById('menu');
  let current = byId.get('inicio');

  function show(token, keepScroll) {
    const docId = token.split('~')[0];
    const target = byId.get(docId) || byId.get('inicio');
    if (current && current !== target) current.hidden = true;
    target.hidden = false;
    current = target;
    links.forEach(a => a.classList.toggle('on', a.dataset.doc === target.id));
    const ph = target.dataset.phase;
    if (ph) {
      const det = document.querySelector('.ph-nav[data-phase="' + ph + '"]');
      if (det) det.open = true;
    }
    const on = document.querySelector('.side a.on');
    if (on) on.scrollIntoView({ block: 'nearest' });
    const t = target.dataset.title;
    document.title = (target.id === 'inicio' || !t) ? 'Consultor Funcional Odoo 20' : t + ' · Consultor Funcional Odoo 20';
    if (keepScroll) return;
    const el = token.includes('~') ? document.getElementById(token) : null;
    if (el) el.scrollIntoView(); else window.scrollTo(0, 0);
  }

  function route() {
    const token = decodeURIComponent(location.hash.slice(1)) || 'inicio';
    if (q.value) { q.value = ''; }
    show(token);
    document.body.classList.remove('nav-open');
    menu.setAttribute('aria-expanded', 'false');
  }
  window.addEventListener('hashchange', route);
  route();

  menu.addEventListener('click', function () {
    const open = document.body.classList.toggle('nav-open');
    menu.setAttribute('aria-expanded', String(open));
  });

  // búsqueda de texto completo, sin distinguir tildes ni mayúsculas
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  let index = null;
  function buildIndex() {
    index = docs.filter(d => d.id !== 'buscar').map(d => {
      const text = d.querySelector('.prose').textContent.replace(/\s+/g, ' ');
      return { id: d.id, title: d.dataset.title || d.id, path: (d.querySelector('.src code') || {}).textContent || '', text, n: norm(text), nt: norm(d.dataset.title || '') };
    });
  }
  function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function snippet(e, term) {
    const i = e.n.indexOf(term);
    const a = Math.max(0, i - 80), b = Math.min(e.text.length, i + term.length + 120);
    const s = e.text.slice(a, b);
    const k = i - a;
    return (a > 0 ? '… ' : '') + esc(s.slice(0, k)) + '<mark>' + esc(s.slice(k, k + term.length)) + '</mark>' + esc(s.slice(k + term.length)) + (b < e.text.length ? ' …' : '');
  }
  let timer;
  q.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      const raw = q.value.trim();
      if (raw.length < 2) { show(decodeURIComponent(location.hash.slice(1)) || 'inicio', true); return; }
      if (!index) buildIndex();
      const terms = norm(raw).split(/\s+/).filter(Boolean);
      const res = index.filter(e => terms.every(t => e.n.includes(t)))
        .map(e => ({ e, score: (terms.every(t => e.nt.includes(t)) ? 1000 : 0) + e.n.split(terms[0]).length }))
        .sort((x, y) => y.score - x.score).slice(0, 40);
      hits.innerHTML = res.length
        ? '<p>' + res.length + (res.length === 40 ? '+' : '') + ' documentos contienen «' + esc(raw) + '».</p>' +
          res.map(r => '<div class="hit"><a href="#' + r.e.id + '">' + esc(r.e.title) + '</a>' + (r.e.path ? '<small>' + esc(r.e.path) + '</small>' : '') + '<p>' + snippet(r.e, terms[0]) + '</p></div>').join('')
        : '<p>Ningún documento contiene «' + esc(raw) + '». Prueba con menos palabras o con el nombre técnico del campo.</p>';
      if (current) current.hidden = true;
      current = byId.get('buscar');
      current.hidden = false;
      window.scrollTo(0, 0);
    }, 140);
  });
  q.addEventListener('keydown', function (e) { if (e.key === 'Escape') { q.value = ''; q.dispatchEvent(new Event('input')); q.blur(); } });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== q && !e.metaKey && !e.ctrlKey) { e.preventDefault(); q.focus(); }
  });
})();
</script>
